name: Quran Launcher — Original Engine MP4 Render

on:
  push:
    branches: [feature/islamic-tiktok-engine-port]
    paths:
      - '.github/workflows/quran-launcher-engine-render.yml'
      - 'engine/**'
      - 'ENGINE_PORT_STATUS.md'
  workflow_dispatch:
    inputs:
      background_rotation_key:
        description: Optional seed for rotating the approved moving-video backgrounds
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: quran-launcher-engine-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Check out isolated launcher branch
        uses: actions/checkout@v4

      - name: Restore checksum-pinned official audio archive cache
        uses: actions/cache@v4
        with:
          path: engine/output/kfgqpc_maher_verified.zip
          key: kfgqpc-maher-archive-3edcc70407f9d19c972c002c69a43cc245a62a0fcc497d3c719406a69965e18e

      - name: Install FFmpeg and approved Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core fonts-dejavu-core
          fc-cache -f
          python - <<'PY'
          import subprocess
          match = subprocess.check_output(
              ['fc-match', '-f', '%{family}|%{style}|%{file}', 'Amiri:style=Bold'],
              text=True
          ).strip()
          print('Resolved Arabic font:', match)
          family, style, path = match.split('|', 2)
          if 'Amiri' not in family or 'Bold' not in style or not path.endswith(('.ttf', '.otf')):
              raise SystemExit('Required Amiri Bold font unavailable; refusing fallback.')
          PY

      - name: Install Python renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow remotezip requests

      - name: Run original renderer safety regression tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_render_video_duration.py' -v
          python -m unittest discover -s tests -p 'test_background_rotation.py' -v
          python -m unittest discover -s tests -p 'test_validate_content_manifest.py' -v
          python -m unittest discover -s tests -p 'test_build_official_audio_inventory.py' -v
          python -m unittest discover -s tests -p 'test_prepare_official_quran_passage.py' -v
          python -m unittest discover -s tests -p 'test_content_rotation.py' -v
          python -m unittest discover -s tests -p 'test_asset_rotation.py' -v
          python -m unittest discover -s tests -p 'test_background_candidates.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_review_batch.py' -v
          python -m unittest discover -s tests -p 'test_build_requested_quran_passage.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_draft_manifests.py' -v
          python -m unittest discover -s tests -p 'test_prepare_background_review_batch.py' -v
          python -m unittest discover -s tests -p 'test_prepare_background_review_previews.py' -v
          python -m unittest discover -s tests -p 'test_render_quran_review_batch.py' -v
          python -m unittest discover -s tests -p 'test_render_quran_review_previews.py' -v
          python -m unittest discover -s tests -p 'test_render_dua_video.py' -v
          python -m unittest discover -s tests -p 'test_select_requested_quran_range.py' -v
          python -m unittest discover -s tests -p 'test_validate_quran_reference.py' -v
          python -m unittest discover -s tests -p 'test_select_review_manifest.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator.py' -v
          python -m unittest discover -s tests -p 'test_quran_visual_templates.py' -v
          python -m unittest discover -s tests -p 'test_quran_social_caption.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_tunisian_day_status.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_translation_catalog.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_uthmani_catalog.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_video_catalog.py' -v
          python -m unittest discover -s tests -p 'test_quran_audio_parts.py' -v
          python -m unittest discover -s tests -p 'test_prepare_quran_review_batch_audio.py' -v
          python -m unittest discover -s tests -p 'test_content_rotation_repository_safety.py' -v
          python -m unittest discover -s tests -p 'test_background_reel.py' -v
          python -m unittest discover -s tests -p 'test_background_additions_review.py' -v

      - name: Validate approved Quran text and manifest
        env:
          PYTHONPATH: src
        run: |
          python src/validate_quran_text.py --manifest content/first_video.json --reference data/reference/quran_text_uthmani.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('content/first_video.json').read_text(encoding='utf-8'))
          if manifest['source']['surah_number'] != 94 or manifest['source']['verses'] != [5, 6]:
              raise SystemExit('Only the explicitly approved first test passage is enabled in this initial launcher render.')
          if manifest.get('publishing', {}).get('auto_publish') is not False:
              raise SystemExit('Automatic publishing must remain disabled.')
          print('Approved Surah Ash-Sharh 94:5–6 manifest validated.')
          PY

      - name: Build checksum-pinned official Hafs archive inventory
        run: python src/build_official_audio_inventory.py output/official_verse_audio_inventory.json

      - name: Prepare exact approved Maher Al-Muaiqly Hafs audio
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from build_official_audio_inventory import create_archive_session, download_verified_archive
          import json, subprocess
          inventory = json.loads(Path('output/official_verse_audio_inventory.json').read_text(encoding='utf-8'))
          archive_path = inventory.get('archive_path')
          if not archive_path:
              # Some CDN responses pass the small range preflight but reject
              # RemoteZip's later requests. Fall back to the source builder's
              # bounded full download and mandatory published SHA-256 check.
              session = create_archive_session()
              try:
                  archive_path = download_verified_archive(
                      session, inventory['source_url'], Path('output/kfgqpc_maher_verified.zip')
                  )
              finally:
                  session.close()
          archive = ZipFile(archive_path)
          work = Path('build/audio')
          work.mkdir(parents=True, exist_ok=True)
          durations = {}
          with archive:
              names = archive.namelist()
              for verse in (5, 6):
                  suffix = f'10-094{verse:03d}-A08.mp3'
                  matches = [name for name in names if name.endswith(suffix)]
                  if len(matches) != 1:
                      raise RuntimeError(f'Expected exactly one official Hafs audio member for verse {verse}; found {matches}')
                  source = work / f'verse_{verse:02d}_source.mp3'
                  with archive.open(matches[0]) as src, source.open('wb') as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
                  processed = work / f'verse_{verse:02d}.mp3'
                  subprocess.run([
                      'ffmpeg', '-hide_banner', '-y', '-i', str(source),
                      '-af', 'silenceremove=start_periods=1:start_duration=0.15:start_threshold=-50dB:start_silence=0.10:stop_periods=1:stop_duration=0.15:stop_threshold=-50dB:stop_silence=0.10',
                      '-c:a', 'libmp3lame', '-q:a', '2', str(processed)
                  ], check=True)
                  durations[str(verse)] = float(subprocess.check_output([
                      'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                      '-of', 'default=nw=1:nk=1', str(processed)
                  ], text=True).strip())
          concat = work / 'concat.txt'
          concat.write_text(
              ''.join(f"file '{(work / f'verse_{n:02d}.mp3').resolve()}'\n" for n in (5, 6)),
              encoding='utf-8'
          )
          output = Path('output/ash_sharh_94_5_6_approved_audio.mp3')
          output.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run([
              'ffmpeg', '-hide_banner', '-y', '-f', 'concat', '-safe', '0',
              '-i', str(concat), '-c:a', 'libmp3lame', '-q:a', '2', str(output)
          ], check=True)
          print('Verified processed verse durations:', durations)
          print('Combined recitation:', output)
          PY

      - name: Render original cinematic 9:16 MP4 with rotated moving background
        env:
          BACKGROUND_ROTATION_KEY: ${{ inputs.background_rotation_key }}
          PYTHONPATH: src
        run: |
          key="${BACKGROUND_ROTATION_KEY:-launcher-run-${GITHUB_RUN_ID}}"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path = Path('content/first_video.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          audio = Path('output/ash_sharh_94_5_6_approved_audio.mp3')
          manifest['audio']['production_audio_file'] = str(audio)
          manifest['audio']['processed_verse_durations_seconds'] = {
              '5': float(__import__('subprocess').check_output([
                  'ffprobe','-v','error','-show_entries','format=duration',
                  '-of','default=nw=1:nk=1','build/audio/verse_05.mp3'
              ], text=True).strip()),
              '6': float(__import__('subprocess').check_output([
                  'ffprobe','-v','error','-show_entries','format=duration',
                  '-of','default=nw=1:nk=1','build/audio/verse_06.mp3'
              ], text=True).strip())
          }
          manifest['audio']['inter_verse_silence_seconds'] = 0.02
          Path('build/launcher_manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          python src/render_video_scenes.py --manifest build/launcher_manifest.json --output output/review.mp4 --background-rotation --background-rotation-key "$key"

      - name: Verify MP4 technical requirements
        run: |
          python - <<'PY'
          import json, subprocess
          info = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error', '-show_streams', '-show_format',
              '-of', 'json', 'output/review.mp4'
          ], text=True))
          video = next((s for s in info['streams'] if s.get('codec_type') == 'video'), None)
          audio = next((s for s in info['streams'] if s.get('codec_type') == 'audio'), None)
          duration = float(info['format']['duration'])
          if not video or not audio:
              raise SystemExit('MP4 must contain video and Quran audio.')
          if (video.get('width'), video.get('height')) != (1080, 1920):
              raise SystemExit('Expected vertical 1080x1920 output.')
          if video.get('r_frame_rate') != '30/1':
              raise SystemExit('Expected 30 FPS.')
          if not 0 < duration <= 40:
              raise SystemExit(f'Expected duration in (0, 40] seconds; got {duration:.2f}.')
          print(f'PASS: MP4 1080x1920, 30 FPS, Quran audio present, {duration:.2f}s.')
          PY

      - name: Upload review-only MP4
        uses: actions/upload-artifact@v4
        with:
          name: quran-launcher-original-engine-review
          path: engine/output/review.mp4
          retention-days: 7
