# Audio review workflow; helper syntax corrections validated on this isolated branch.
name: Al-Ikhlas — Maher Hafs audio review

on:
  push:
    branches: [feature/islamic-tiktok-engine-port]
    paths:
      - '.github/workflows/al-ikhlas-audio-review.yml'
      - 'engine/content/candidate_surah_al_ikhlas_112_1_4.json'
      - 'engine/src/prepare_al_ikhlas_audio_review.py'
      - 'engine/tests/test_prepare_al_ikhlas_audio_review.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: al-ikhlas-audio-review
  cancel-in-progress: true

jobs:
  prepare-audio-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Check out isolated launcher branch
        uses: actions/checkout@v4

      - name: Restore checksum-pinned official audio archive cache
        uses: actions/cache@v4
        with:
          path: engine/output/kfgqpc_maher_verified.zip
          key: kfgqpc-maher-archive-3edcc70407f9d19c972c002c69a43cc245a62a0fcc497d3c719406a69965e18e

      - name: Install FFmpeg if the runner does not provide it
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo timeout 8m apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 8m apt-get -o Acquire::Retries=2 install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install audio inventory dependencies
        run: python -m pip install --disable-pip-version-check requests remotezip

      - name: Validate the Al-Ikhlas candidate stays review-only and uses Maher Hafs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('content/candidate_surah_al_ikhlas_112_1_4.json').read_text(encoding='utf-8'))
          if manifest.get('content_type') != 'quran':
              raise SystemExit('Al-Ikhlas candidate must be Quran content.')
          if manifest.get('source', {}).get('surah_number') != 112 or manifest.get('source', {}).get('verses') != [1, 2, 3, 4]:
              raise SystemExit('Expected complete Al-Ikhlas 112:1–4.')
          audio = manifest.get('audio', {})
          if audio.get('reciter_name') != 'ماهر المعيقلي' or audio.get('riwaya') != 'حفص عن عاصم':
              raise SystemExit('Al-Ikhlas audio candidate must use Maher Al-Muaiqly Hafs.')
          if audio.get('approved') is not False or audio.get('exact_recording_user_reviewed') is not False:
              raise SystemExit('Al-Ikhlas audio must remain unapproved pending exact-file listening review.')
          if manifest.get('rotation_approved') is not False or manifest.get('publishing', {}).get('auto_publish') is not False:
              raise SystemExit('Al-Ikhlas must remain excluded from rotation and auto-publishing.')
          print('PASS: complete Al-Ikhlas candidate uses Maher Hafs and remains review-only.')
          PY

      - name: Test isolated Al-Ikhlas audio review preparation
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_prepare_al_ikhlas_audio_review.py' -v

      - name: Build checksum-pinned official Maher Hafs audio inventory
        run: python src/build_official_audio_inventory.py output/official_verse_audio_inventory.json

      - name: Extract complete Al-Ikhlas 112:1–4 for audio review only
        env:
          PYTHONPATH: src
        run: |
          python src/prepare_al_ikhlas_audio_review.py \
            --inventory output/official_verse_audio_inventory.json \
            --output-dir output/al_ikhlas_audio_review \
            --report output/al_ikhlas_audio_review/report.json

      - name: Upload Al-Ikhlas audio review package
        uses: actions/upload-artifact@v4
        with:
          name: al-ikhlas-maher-hafs-audio-review
          path: engine/output/al_ikhlas_audio_review/
          if-no-files-found: error
          retention-days: 3
